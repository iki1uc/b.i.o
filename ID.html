.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.underline {
  text-decoration-line: underline;
}
.decoration-dotted {
  text-decoration-style: dotted;
}
.underline-offset-4 {
  text-underline-offset: 4px;
}
.filter {

}
.transition-\[width\] {
  transition-property: width;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}
.duration-100 {
  transition-duration: 100ms;
}
:root {
  --bg: #000000;
  --surface: #010301;
  --panel: #020a02;
  --panel-2: #031203;
  --line: #00ff00;
  --line-dim: #0a5c0a;
  --green: #00ff00;
  --green-dim: #00b300;
  --green-faint: #063006;
  --text: #00ff00;
  --text-dim: #37c837;
  --warn: #d8ff00;
  --danger: #ff2222;
  --safe-area-inset-top: 0px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #010301;
    --panel: #020a02;
    --panel-2: #031203;
    --line: #00ff00;
    --line-dim: #0a5c0a;
    --green: #00ff00;
    --green-dim: #00b300;
    --green-faint: #063006;
    --text: #00ff00;
    --text-dim: #37c837;
    --warn: #d8ff00;
    --danger: #ff2222;
  }
}
html,
body {
  background: var(--bg);
  color: var(--text);
}
body {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}
@keyframes bio-blink {
  0%, 60% {
    opacity: 1;
  }
  61%, 100% {
    opacity: 0;
  }
}
@keyframes bio-spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes bio-scanline {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(400%);
  }
}
@keyframes bio-pulse-border {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(0, 255, 0, 0);
  }
  50% {
    box-shadow: 0 0 18px 0 rgba(0, 255, 0, 0.35);
  }
}
.bio-blink {
  animation: bio-blink 1.1s steps(1) infinite;
}
.bio-beam {
  animation: bio-spin 2.4s linear infinite;
}
.bio-scanline {
  animation: bio-scanline 3.2s linear infinite;
}
.bio-pulse {
  animation: bio-pulse-border 1.6s ease-in-out infinite;
}
.bio-grid-bg {
  background-image:
    linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
}
.hover\:bg-\[var\(--danger\)\]:hover {
  background-color: var(--danger);
}
.hover\:bg-\[var\(--green\)\]:hover {
  background-color: var(--green);
}
.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:flex-row {
    flex-direction: row;
  }
  .sm\:px-4 {
    padding-left: 1rem;

  }

  }
  .sm\:text-\[13px\] {
    font-size: 13px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

    grid-template-columns: 1fr 240px;
  }

    grid-template-columns: 220px 1fr;
  }
  .md\:border-l {

  }

  }
}
