  :root {
    --bg: #000000;
    --surface: #020602;
    --panel: #031003;

    --neon-dim: #00aa00;
    --neon-faint: #005500;
    --ink: #00ff00;

  color: var(--ink);
}
.crt::after {
  content: "";
  position: absolute;
  inset: 0;

    transparent 1px,
    transparent 3px
  );

@keyframes blink {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.blink {
  animation: blink 1s steps(1) infinite;
}

  0%, 100% {

  }
  50% {
    text-shadow: 0 0 2px rgba(0,255,0,.6), 0 0 8px rgba(0,255,0,.25);
  }
}
.glow {
  animation: pulseGlow 2.4s ease-in-out infinite;
}
@keyframes scanSweep {
  0% {
    transform: translateY(-100%);
  }
  100% {
    transform: translateY(400%);
  }
}
.scanbeam {
  animation: scanSweep 7s linear infinite;
